[project]
name = "sdlc-flow"
version = "0.1.0"
description = "Automated SDLC Flow using CrewAI"
authors = [
    {name = "Nikita", email = "nikita@example.com"}
]
dependencies = [
    "crewai>=0.28.0",
    "crewai-tools>=0.1.7",
    "chromadb>=0.4.24",
    "playwright>=1.42.0",
    "pydantic-settings>=2.2.1",
    "typer[all]>=0.9.0",
    "rich>=13.7.1",
    "python-telegram-bot>=21.0.1",
    "python-dotenv>=1.0.1",
    "langchain-community>=0.0.31",
]
requires-python = ">=3.12"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.black]
line-length = 88
target-version = ['py312']

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
